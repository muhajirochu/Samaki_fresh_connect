name: samakifresh_connect
description: Mobile marketplace for Zanzibar's fish supply chain ecosystem. Connects fishermen, dalali, street sellers, and buyers.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  
  # Navigation
  go_router: ^14.0.0
  
  # State Management
  hooks_riverpod: ^2.4.0
  flutter_hooks: ^0.20.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  
  # Storage & Images
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  
  # Networking
  dio: ^5.3.0

  # Maps & Geo (Phase 2 — OSM-only, no Google Maps key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.2.0
  dart_geohash: ^2.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # Utilities
  intl: ^0.20.0
  url_launcher: ^6.2.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.2.4
  
  # Localization
  flutter_localizations:
    sdk: flutter

  # Code Generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0

  # Logging & Monitoring
  logger: ^2.0.0
  google_maps_flutter: ^2.14.2
  geocoding: ^4.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.0
  geocoding_platform_interface: ^3.2.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/logo.png
  generate: true
