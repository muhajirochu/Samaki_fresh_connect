name: samakifresh_connect
description: Mobile marketplace for Zanzibar's fish supply chain ecosystem. Connects street sellers and buyers.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  # google_fonts removed — was fetching Poppins from Google Fonts over the
  # network on first cold start. With a fresh install + slow / patchy
  # connection this could add several seconds before the splash resolved,
  # and it never reused a cached copy across reinstalls because the
  # package's cache directory was wiped with the app data. Poppins is now
  # bundled under assets/fonts/ and applied via a tiny wrapper at
  # lib/utils/app_fonts.dart so every `GoogleFonts.poppins(...)` call site
  # becomes a synchronous bundled-font read — no network, no cache.

  # Navigation
  go_router: ^14.0.0
  
  # State Management
  hooks_riverpod: ^2.4.0
  flutter_hooks: ^0.20.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  
  # Storage & Images
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  
  # Networking
  dio: ^5.3.0

  # Maps & Geo (Phase 2 — OSM-only, no Google Maps key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.2.0
  dart_geohash: ^2.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.2.4
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0

  # App distribution — install card PDF
  pdf: ^3.11.3
  printing: ^5.13.1
  path_provider: ^2.1.0
  
  # Localization
  flutter_localizations:
    sdk: flutter

  # Code Generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0

  # Logging & Monitoring
  logger: ^2.0.0
  geocoding: ^4.0.0
  # google_maps_flutter removed — the app uses flutter_map (OSM tiles)
  # everywhere and never instantiates a GoogleMap widget. Dropping the
  # package saves ~5–10 MB of native code in the APK and trims the
  # cold-install / first-launch cost noticeably.

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.0
  geocoding_platform_interface: ^3.2.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/logo.png
    - assets/qr/install-card-qr.png

  # Poppins is shipped inside the APK so the first cold start never has
  # to reach out to fonts.googleapis.com. Weights cover every usage in
  # lib/config/{light,dark}_theme.dart — Regular, Medium, SemiBold, Bold
  # each in upright and italic. The italic files are ~180 kB each but
  # needed because at least one screen renders an italic emphasis.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
  generate: true
